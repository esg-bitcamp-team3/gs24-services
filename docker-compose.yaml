services:
  crawl-service:
    build:
      context: ./services/crawl-service
    env_file:
      - ./services/crawl-service/.env
    ports:
      - "8001:8000"

  market-service:
    build:
      context: ./services/market-service
    env_file:
      - ./services/market-service/.env
    ports:
      - "8002:8000"

  search-service:
    build:
      context: ./services/search-service
    env_file:
      - ./services/search-service/.env
    ports:
      - "8003:8000"

  finance-service:
    build:
      context: ./services/finance-service
    env_file:
      - ./services/finance-service/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8004:8000"

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - crawl-service
      - market-service
      - search-service
      - finance-service
